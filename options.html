<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boosts</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="styles/tokens.css" />

    <header class="top">
      <div class="brand"><img src="icons/icon-48.png" alt="" /></div>
